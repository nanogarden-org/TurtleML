[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turtleml"
version = "0.1.0a0"
description = "Reference architecture for recursive local-first AI/ML nodes with explicit provenance and authority boundaries."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Robin Abigayle Bronson" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
